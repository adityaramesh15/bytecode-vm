name: bytecode-vm CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Install System Toolchain & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang clang-tidy ninja-build libc++-dev libc++abi-dev

    - name: Configure CMake Build
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Compile Target Binary
      run: cmake --build build --config Debug --target bytecode_vm vm_tests

    - name: Execute Automated Test Engine (with ASan/UBSan)
      run: |
        cd build
        ./vm_tests