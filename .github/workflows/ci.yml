name: bytecode-vm CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Install System Toolchain & Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake clang clang-tidy ninja-build

    - name: Configure CMake Build
      run: cmake --preset ci

    - name: Compile Target Binary
      run: cmake --build --preset ci

    - name: Execute Automated Test Engine (with ASan/UBSan)
      run: ./build/vm_tests